name: Unit Tests

on:
  workflow_call:

permissions:
  contents: read
  # For the coverage comment on the pull request.
  pull-requests: write

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.24.x", "1.25.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      # Coverage only on the current Go: go.mod asks for 1.25, so the 1.24 leg
      # runs an auto-downloaded toolchain that lacks the covdata tool, and
      # -coverprofile fails with 'no such tool "covdata"' on main.go.
      - name: Test
        if: matrix.go-version != '1.25.x'
        run: go test ./...

      - name: Test with coverage
        if: matrix.go-version == '1.25.x'
        run: go test -covermode=set -coverprofile=coverage.out ./...

      - name: Coverage report
        if: matrix.go-version == '1.25.x'
        run: |
          ./scripts/coverage-report.sh
          cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

      # A pull request from a fork gets a read-only token, so it only gets the
      # job summary above.
      - name: Coverage PR comment
        if: >-
          matrix.go-version == '1.25.x' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          recreate: true
          path: code-coverage-results.md

      - name: Jet3 Synthetic Regression
        if: matrix.go-version == '1.25.x'
        run: |
          go test ./internal/mdb -run 'TestProbeClassifiesSyntheticJet32K|TestOpenJet3Uses2048PageSize|TestReadTableDefJet3Synthetic|TestReadRowsJet3Synthetic|TestResolveMemoJet3'
          go test ./internal/vba -run 'TestScanOrphanedLvalModules_Jet3LayoutSynthetic'

      - name: Optional Legacy Fixture Regression
        if: matrix.go-version == '1.25.x'
        run: |
          if [[ -f testdata/jet35/st990426.mdb ]]; then
            go test ./internal/vba -run 'TestExtractAllModulesFromLegacyFixture'
            go test ./cmd -run 'TestLoadSchema_legacyFixture'
          else
            echo "Legacy fixture testdata/jet35/st990426.mdb not present; skipping optional fixture regression."
          fi
